---
- hosts: all
  user: itadmin
  become: yes

  vars:
    validation_input_file: "expected_pamcontent.txt"

  tasks:
    - name: Read Validation input file
      slurp:
        src: "{{ validation_input_file }}"
      delegate_to: localhost
      register: input_file_content

    - name: Report Validation result
      debug:
        msg: "Validation: {{ input_file_content }}"



